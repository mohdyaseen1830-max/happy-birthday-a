<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Aysiha! 💜✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --purple-dark: #3a225d;
            --purple-medium: #5b3286;
            --purple-light: #9d71c7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-color: #3a225d;
            --accent-pink: #d980fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Full-screen watercolor floral background */
            background-image: url('bg.jpg.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #4a2875;
            color: var(--text-color);
            font-family: 'Fredoka', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Flower Petal Falling Animation */
        .petal {
            position: absolute;
            background-color: #e0b0ff;
            border-radius: 15px 0px 15px 0px;
            opacity: 0.7;
            pointer-events: none;
            z-index: 100;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translate(0, -10px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translate(100px, 100vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Peeking Cats Styling */
        .cat-peeking {
            position: absolute;
            font-size: 2.5rem;
            z-index: 20;
            user-select: none;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
        }

        .cat-top {
            top: -38px;
            right: 25px;
            animation: peekDown 3s infinite alternate ease-in-out;
        }

        .cat-left {
            left: -32px;
            bottom: 30px;
            transform: rotate(90deg);
            animation: peekRight 4s infinite alternate ease-in-out;
        }

        .cat-right {
            right: -32px;
            top: 40%;
            transform: rotate(-90deg);
            animation: peekLeft 3.5s infinite alternate ease-in-out;
        }

        @keyframes peekDown {
            0%, 70% { transform: translateY(0); }
            100% { transform: translateY(8px); }
        }

        @keyframes peekRight {
            0%, 70% { transform: rotate(90deg) translateY(0); }
            100% { transform: rotate(90deg) translateY(8px); }
        }

        @keyframes peekLeft {
            0%, 70% { transform: rotate(-90deg) translateY(0); }
            100% { transform: rotate(-90deg) translateY(8px); }
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: var(--card-bg);
            border: 3px solid var(--purple-light);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(25, 10, 45, 0.4);
            text-align: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h1 {
            font-family: 'Cherry Bomb One', cursive;
            color: var(--purple-medium);
            font-size: 2.1rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* Chat / Conversation Styling */
        .chat-box {
            background: #f4ecf7;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            border: 2px dashed var(--purple-light);
        }

        .chat-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: popIn 0.3s ease-out forwards;
        }

        .bot-bubble {
            background: #ffffff;
            color: var(--text-color);
            align-self: flex-start;
            border: 2px solid var(--purple-light);
            border-bottom-left-radius: 4px;
        }

        .user-bubble {
            background: var(--purple-medium);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Mini Matching Game */
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .card {
            aspect-ratio: 1;
            background: #eae0f2;
            border: 3px solid var(--purple-light);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card.revealed {
            background: #ffffff;
            border-color: var(--purple-medium);
        }

        .btn {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            background: var(--purple-medium);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(91, 50, 134, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn:hover {
            background: #4a2875;
            transform: scale(1.03);
        }

        /* Letter Image Display */
        #letter-screen {
            display: none;
            animation: popIn 0.5s ease-out forwards;
        }

        .letter-image-container {
            border: 3px solid var(--purple-light);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background: #fff;
        }

        .letter-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 17px;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Peeking Cats -->
    <div class="cat-peeking cat-top">🐱</div>
    <div class="cat-peeking cat-left">🐾</div>
    <div class="cat-peeking cat-right">😸</div>

    <!-- STAGE 1: Cute Conversation -->
    <div id="chat-screen">
        <h1>Hey Aysiha! ✨</h1>
        <div class="chat-box" id="chat-box">
            <div class="chat-bubble bot-bubble">Psst... Aysiha, do you know what day it is today? 🤔</div>
        </div>
        <button class="btn" id="chat-btn" onclick="nextChatStep()">Is it... my birthday? 🥺</button>
    </div>

    <!-- STAGE 2: Mini Game -->
    <div id="game-screen" style="display: none;">
        <h1>Unlock Your Surprise 🎁</h1>
        <p style="margin-bottom: 15px; font-size: 0.9rem;">Match the cute pairs to open your letter, Aysiha!</p>
        <div class="game-board" id="board"></div>
    </div>

    <!-- STAGE 3: Birthday Letter Image & Petals -->
    <div id="letter-screen">
        <div class="letter-image-container">
            <img src="letter.jpg.png.jpeg" alt="Birthday Letter for Aysiha" class="letter-img">
        </div>
        <button class="btn" onclick="triggerConfetti()">More Magic! ✨</button>
    </div>
</div>

<script>
    /* Chat Logic */
    let chatStep = 0;
    const chatBox = document.getElementById('chat-box');
    const chatBtn = document.getElementById('chat-btn');

    function nextChatStep() {
        if (chatStep === 0) {
            addBubble("Is it... my birthday? 🥺", "user-bubble");
            setTimeout(() => {
                addBubble("YES! 🎉 Happy Birthday Aysiha! I made something super special for you!", "bot-bubble");
                chatBtn.innerText = "Yay! Show me! 💕";
            }, 600);
            chatStep++;
        } else if (chatStep === 1) {
            addBubble("Yay! Show me! 💕", "user-bubble");
            setTimeout(() => {
                addBubble("First, you have to win a quick little game! Ready, Aysiha? 🎀", "bot-bubble");
                chatBtn.innerText = "Let's Play! 🌸";
            }, 600);
            chatStep++;
        } else if (chatStep === 2) {
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            initGame();
        }
    }

    function addBubble(text, className) {
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${className}`;
        bubble.innerText = text;
        chatBox.appendChild(bubble);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* Game Logic */
    const icons = ['🐱', '🌸', '🍰'];
    let deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
    let firstCard = null, secondCard = null, lockBoard = false, matches = 0;

    function initGame() {
        const board = document.getElementById('board');
        deck.forEach((icon) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.icon = icon;
            card.innerText = '❓';
            card.addEventListener('click', flipCard);
            board.appendChild(card);
        });
    }

    function flipCard() {
        if (lockBoard || this === firstCard || this.classList.contains('revealed')) return;
        this.innerText = this.dataset.icon;
        this.classList.add('revealed');

        if (!firstCard) {
            firstCard = this;
            return;
        }

        secondCard = this;
        lockBoard = true;

        if (firstCard.dataset.icon === secondCard.dataset.icon) {
            matches++;
            resetTurn();
            if (matches === 3) setTimeout(showLetter, 500);
        } else {
            setTimeout(() => {
                firstCard.innerText = '❓';
                secondCard.innerText = '❓';
                firstCard.classList.remove('revealed');
                secondCard.classList.remove('revealed');
                resetTurn();
            }, 800);
        }
    }

    function resetTurn() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
    }

    /* Letter Image & Flower Petals */
    function showLetter() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('letter-screen').style.display = 'block';
        startPetals();
        triggerConfetti();
    }

    function startPetals() {
        for (let i = 0; i < 25; i++) {
            setTimeout(createPetal, i * 200);
        }
    }

    function createPetal() {
        const petal = document.createElement('div');
        petal.classList.add('petal');
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.width = Math.random() * 12 + 8 + 'px';
        petal.style.height = Math.random() * 12 + 8 + 'px';
        petal.style.animationDuration = Math.random() * 3 + 3 + 's';
        document.body.appendChild(petal);

        setTimeout(() => petal.remove(), 6000);
    }

    function triggerConfetti() {
        confetti({
            particleCount: 80,
            spread: 60,
            origin: { y: 0.6 },
            colors: ['#9d71c7', '#d980fa', '#e0b0ff', '#ffffff']
        });
    }
</script>
</body>
</html>
